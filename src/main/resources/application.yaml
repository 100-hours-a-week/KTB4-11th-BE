spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: river_be
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    open-in-view: false

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  frontend-origin: ${FRONTEND_ORIGIN}
  secure-cookie: ${AUTH_COOKIE_SECURE:true}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:stockspoon}
  access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:14d}

kiwoom:
  app-key: ${KIWOOM_APP_KEY:}
  app-secret: ${KIWOOM_APP_SECRET:}
  stream:
    enabled: ${KIWOOM_STREAM_ENABLED:false}
