name: Backend Main CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"


concurrency:
  group: be-main-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ECR_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/g8x9p1p0
  ECR_REPOSITORY: stockspoon-v1-backend

jobs:
  build:
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      id-token: write

    steps:
      # 1. CI Runner에 Repo의 코드를 가져온다
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Java 실행 환경을 구성한다
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # 3. Gradle 실행 환경을 구성하고 Cache를 사용한다
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. 컴파일된 Bytecode를 SpotBugs로 정적 분석한다
      - name: SpotBugs
        run: ./gradlew spotbugsMain --build-cache

      # 5. Compile, Test, Package를 수행한다
      - name: Build
        run: ./gradlew build --build-cache

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Login to Public ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      # SpotBugs 검사 실패 시 Report를 남긴다
      - name: Upload SpotBugs report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
