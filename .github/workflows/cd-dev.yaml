name: Backend Dev CD (V2)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing backend image tag (40-character commit SHA)
        required: true
        type: string
      automatic:
        description: Skip deployment if the image is no longer the dev branch head
        default: false
        type: boolean

concurrency:
  group: stockspoon-v2-dev-backend-deploy
  cancel-in-progress: false

jobs:
  verify-image:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-26.04
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
    permissions:
      contents: read
      id-token: write
    env:
      ECR_REGION: us-east-1
      ECR_REPOSITORY: stockspoon-v2-backend
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Validate deployment source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATIC: ${{ inputs.automatic }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid commit SHA' >&2; exit 1; }
          if [[ "$AUTOMATIC" == 'true' ]]; then
            current_dev_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/dev" --jq .sha)"
            [[ "$current_dev_sha" =~ ^[0-9a-f]{40}$ ]]
            if [[ "$IMAGE_TAG" != "$current_dev_sha" ]]; then
              echo '::notice::Skipping stale automatic deployment'
              echo 'deploy=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials with OIDC
        if: steps.source.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_V2_DEV_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Verify the V2 image in Public ECR
        if: steps.source.outputs.deploy == 'true'
        run: |
          set -Eeuo pipefail
          IMAGE_DIGEST="$(aws ecr-public describe-images \
            --region "$ECR_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          if [[ -z "$IMAGE_DIGEST" || "$IMAGE_DIGEST" == "None" ]]; then
            echo "V2 image not found in Public ECR: $IMAGE_TAG" >&2
            exit 1
          fi

          echo "Verified stockspoon-v2-backend:$IMAGE_TAG@$IMAGE_DIGEST"

  deploy:
    needs: verify-image
    if: needs.verify-image.outputs.deploy == 'true'
    runs-on: ubuntu-26.04
    environment: development
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      SERVICE: backend
      TAG_KEY: BE_TAG
      ECR_REPOSITORY: stockspoon-v2-backend
      ECR_REGISTRY: public.ecr.aws/g8x9p1p0
    steps:
      - name: Deploy backend image to the V2 development EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_TAG,SERVICE,TAG_KEY,ECR_REGISTRY,ECR_REPOSITORY
          script: |
            set -Eeuo pipefail
            umask 077
            deploy_started=$SECONDS
            timed() {
              local phase="$1" started=$SECONDS status
              shift
              echo "TIMING phase=$phase event=start"
              if "$@"; then status=0; else status=$?; fi
              echo "TIMING phase=$phase seconds=$((SECONDS - started)) status=$status"
              return "$status"
            }

            : "${IMAGE_TAG:?IMAGE_TAG is required}"
            [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid image tag: $IMAGE_TAG" >&2; exit 1; }
            [[ "$SERVICE:$TAG_KEY" == "backend:BE_TAG" ]] || { echo "Unexpected service/tag key" >&2; exit 1; }

            APP_DIR=/opt/stockspoon-v2
            ENV_FILE="$APP_DIR/.env"
            COMPOSE_FILE="$APP_DIR/docker-compose.yaml"
            [[ -f "$ENV_FILE" ]] || { echo "Missing $ENV_FILE" >&2; exit 1; }
            [[ -f "$COMPOSE_FILE" ]] || { echo "Missing $COMPOSE_FILE" >&2; exit 1; }

            exec 9>"$APP_DIR/.deploy.lock"
            timed lock_wait flock -x 9

            read_tag() {
              awk -F= -v key="$TAG_KEY" '$1 == key { value = substr($0, length(key) + 2) } END { print value }' "$ENV_FILE"
            }

            write_tag() {
              local value="$1"
              local temp_file
              temp_file="$(mktemp "$APP_DIR/.env.XXXXXX")"
              awk -v key="$TAG_KEY" -v value="$value" '
                BEGIN { updated = 0 }
                index($0, key "=") == 1 {
                  if (!updated) print key "=" value
                  updated = 1
                  next
                }
                { print }
                END { if (!updated) print key "=" value }
              ' "$ENV_FILE" > "$temp_file"
              chmod 600 "$temp_file"
              mv "$temp_file" "$ENV_FILE"
            }

            COMPOSE=(docker compose --project-directory "$APP_DIR" --env-file "$ENV_FILE" -f "$COMPOSE_FILE")
            OLD_TAG="$(read_tag)"

            rollback() {
              local status=$?
              trap - EXIT
              echo "TIMING phase=deployment_before_rollback seconds=$((SECONDS - deploy_started)) status=$status"
              if [[ "$OLD_TAG" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Deployment failed; restoring backend tag $OLD_TAG" >&2
                set +e
                write_tag "$OLD_TAG"
                timed rollback_pull "${COMPOSE[@]}" pull "$SERVICE"
                timed rollback_recreate "${COMPOSE[@]}" up -d "$SERVICE"
                timed rollback_nginx "${COMPOSE[@]}" up -d --force-recreate nginx
              else
                echo "Deployment failed and there was no previous valid backend tag to restore." >&2
              fi
              echo "TIMING phase=deployment_total seconds=$((SECONDS - deploy_started)) status=$status"
              exit "$status"
            }
            trap rollback EXIT

            write_tag "$IMAGE_TAG"
            timed image_pull "${COMPOSE[@]}" pull "$SERVICE"
            timed container_recreate "${COMPOSE[@]}" up -d "$SERVICE"

            CONTAINER_NAME="stockspoon-v2-dev-${SERVICE}"
            HEALTH_STATUS=""
            health_started=$SECONDS
            previous_health=""
            for attempt in $(seq 1 60); do
              HEALTH_STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER_NAME" 2>/dev/null || true)"
              if [[ "$HEALTH_STATUS" != "$previous_health" ]]; then
                echo "TIMING phase=health_transition seconds=$((SECONDS - health_started)) state=${HEALTH_STATUS:-missing}"
                previous_health="$HEALTH_STATUS"
              fi
              [[ "$HEALTH_STATUS" == "healthy" ]] && break
              [[ "$HEALTH_STATUS" == "unhealthy" || "$HEALTH_STATUS" == "exited" || "$HEALTH_STATUS" == "dead" ]] && break
              sleep 5
            done
            echo "TIMING phase=health_wait seconds=$((SECONDS - health_started)) state=${HEALTH_STATUS:-missing}"
            if [[ "$HEALTH_STATUS" != "healthy" ]]; then
              "${COMPOSE[@]}" logs --tail=100 "$SERVICE" || true
              echo "Backend did not become healthy (state: ${HEALTH_STATUS:-missing})." >&2
              exit 1
            fi

            OTHER_STATUS="$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' stockspoon-v2-dev-frontend 2>/dev/null || true)"
            if [[ "$OTHER_STATUS" == "healthy" ]]; then
              timed nginx_recreate "${COMPOSE[@]}" up -d --force-recreate nginx
            else
              echo "Frontend is not healthy yet; Nginx will start after its first successful deployment."
            fi

            trap - EXIT
            echo "TIMING phase=deployment_total seconds=$((SECONDS - deploy_started)) status=0"
            echo "Deployed backend image ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Add deployment summary
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.EC2_HOST }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "### Backend V2 development deployment"
            echo "- image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
            echo "- host: $DEPLOY_HOST"
            echo "- result: $RESULT"
            echo '- phase durations: search for TIMING in the SSH deployment step log'
          } >> "$GITHUB_STEP_SUMMARY"
