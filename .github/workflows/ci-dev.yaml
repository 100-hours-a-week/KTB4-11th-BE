name: Backend Dev CI

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - dev           # main 제거 (main 대상 PR에는 CD만 실행)
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: be-dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      # 1. CI Runner에 Repo의 코드를 가져온다
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Java 실행 환경을 구성한다
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # 3. Gradle 실행 환경을 구성하고 Cache를 사용한다
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. 컴파일된 Bytecode를 SpotBugs로 정적 분석한다
      - name: SpotBugs
        run: ./gradlew spotbugsMain --build-cache

      # 5. Compile, Test, Package를 수행한다
      - name: Build
        run: ./gradlew build --build-cache

      - name: Upload tested application JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: build/libs/application.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      # SpotBugs 검사 실패 시 결과를 확인할 수 있도록 Report를 남긴다
      - name: Upload SpotBugs report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/

  push-image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
      contents: read
      id-token: write
    env:
      ECR_REGION: us-east-1
      ECR_REGISTRY: public.ecr.aws/g8x9p1p0
      ECR_REPOSITORY: stockspoon-v2-backend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download tested application JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_V2_DEV_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Login to Public ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build and push V2 backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-v2
          cache-to: type=gha,scope=backend-v2,mode=max

      # 별도 CD 실행을 요청하고 배포 완료를 기다리지 않는다.
      - name: Dispatch independent development and ECS deployments
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          dispatch_status=0
          gh workflow run cd-dev.yaml --ref dev -f "image_tag=$IMAGE_TAG" -f automatic=true || dispatch_status=1
          gh workflow run cd-ecs-v2.yaml --ref dev -f "image_tag=$IMAGE_TAG" -f automatic=true || dispatch_status=1
          exit "$dispatch_status"
