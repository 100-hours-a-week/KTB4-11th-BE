plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.spotbugs' version '6.0.15'
}

group = 'com.stock_spoon'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

spotbugs {
    includeFilter = file("src/main/java/com/stock_spoon/river_be/config/spotbugs/include.xml")
    reportLevel   = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
    effort        = com.github.spotbugs.snom.Effort.valueOf('DEFAULT')
}

tasks.named('spotbugsMain') {
    reports { html.required = true }   // 실패 시 아티팩트로 받아볼 리포트
}

tasks.named('spotbugsTest') { enabled = false }   // 테스트 코드는 검사 안 함


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation platform('software.amazon.awssdk:bom:2.55.6')
    implementation 'software.amazon.awssdk:auth'
    implementation 'software.amazon.awssdk:regions'
    implementation 'software.amazon.awssdk:http-auth-aws'
  implementation 'org.springframework.boot:spring-boot-health:4.1.1'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'test.runtime.classpath', sourceSets.test.runtimeClasspath.asPath
}

bootJar {
    mainClass = 'com.stock_spoon.river_be.RiverBeApplication'
}
bootRun {
    mainClass = 'com.stock_spoon.river_be.RiverBeApplication'
}
tasks.register('executionBootJar', org.springframework.boot.gradle.tasks.bundling.BootJar) {
    targetJavaVersion = JavaVersion.VERSION_21
    mainClass = 'com.stock_spoon.river_be.execution.ExecutionApplication'
    archiveClassifier = 'execution'
    classpath = sourceSets.main.runtimeClasspath
}
tasks.register('executionBootRun', org.springframework.boot.gradle.tasks.run.BootRun) {
    mainClass = 'com.stock_spoon.river_be.execution.ExecutionApplication'
    classpath = sourceSets.main.runtimeClasspath
}
