name: Backend Dev CI

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - dev           # main 제거 (main 대상 PR에는 CD만 실행)
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: be-dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      # 1. CI Runner에 Repo의 코드를 가져온다
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Java 실행 환경을 구성한다
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # 3. Gradle 실행 환경을 구성하고 Cache를 사용한다
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. 컴파일된 Bytecode를 SpotBugs로 정적 분석한다
      - name: SpotBugs
        run: ./gradlew spotbugsMain --build-cache

      # 5. Compile, Test, Package를 수행한다
      - name: Build
        run: ./gradlew build --build-cache

      # SpotBugs 검사 실패 시 결과를 확인할 수 있도록 Report를 남긴다
      - name: Upload SpotBugs report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/