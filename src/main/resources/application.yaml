spring:
  application:
    name: river_be
  datasource:
    url: jdbc:h2:mem:stockspoon;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}
  frontend-origin: ${FRONTEND_ORIGIN:}
  secure-cookie: ${AUTH_COOKIE_SECURE:true}

jwt:
  secret: ${JWT_SECRET:}
  issuer: ${JWT_ISSUER:stockspoon}
  access-expiration: ${JWT_ACCESS_EXPIRATION:15m}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:14d}
