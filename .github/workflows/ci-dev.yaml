name: Backend Dev CI

on:
  push:
    branches:
      - dev
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches:
      - dev           # main 제거 (main 대상 PR에는 CD만 실행)
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: be-dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      # 1. CI Runner에 Repo의 코드를 가져온다
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Java 실행 환경을 구성한다
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # 3. Gradle 실행 환경을 구성하고 Cache를 사용한다
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # 4. 컴파일된 Bytecode를 SpotBugs로 정적 분석한다
      - name: SpotBugs
        run: ./gradlew spotbugsMain --build-cache

      # 5. Compile, Test, Package를 수행한다
      - name: Build
        run: ./gradlew build --build-cache

#      # 6. AWS ECR로 새로운 이미지 업로드
#      - name: Configure AWS credentials
#        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
#        uses: aws-actions/configure-aws-credentials@v4
#        with:
#          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
#          aws-region: us-east-1

#      - name: Login to Public ECR
#        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
#        uses: aws-actions/amazon-ecr-login@v2
#        with:
#          registry-type: public

#      - name: Build and push Docker image
#        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
#        env:
#          IMAGE_URI: public.ecr.aws/g8x9p1p0/stockspoon-v1-backend:${{ github.sha }}
#        run: |
#          docker build -t "$IMAGE_URI" .
#          docker push "$IMAGE_URI"

      # SpotBugs 검사 실패 시 결과를 확인할 수 있도록 Report를 남긴다
      - name: Upload SpotBugs report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/